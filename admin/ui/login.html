<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin sign in · Carmel Publications</title>
<style>
  :root { --navy:#11162B; --primary:#3155E7; --primary-hover:#2143cc; --bg:#FAF9F6; --border:#E3E5EA; --danger:#C62828; --muted:#545B6E; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.25rem;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#171923;
         background:radial-gradient(900px 500px at 15% -10%, #dfe6ff 0%, transparent 60%),
                    radial-gradient(700px 420px at 100% 110%, #ffe6d3 0%, transparent 60%), var(--bg); }
  .card { width:100%; max-width:400px; background:#fff; border:1px solid var(--border); border-radius:18px;
          padding:2rem 1.75rem; box-shadow:0 14px 32px -6px rgba(17,22,43,.14); }
  .mark { width:46px; height:46px; border-radius:12px; background:var(--navy); color:#D7F45B; display:grid; place-items:center; font-weight:800; font-size:1.3rem; margin-bottom:1rem; }
  h1 { margin:0 0 .3rem; font-size:1.4rem; color:var(--navy); }
  p { margin:0 0 1.4rem; color:var(--muted); font-size:.92rem; line-height:1.5; }
  label { display:block; font-weight:600; font-size:.85rem; margin-bottom:.4rem; }
  input { width:100%; padding:.8rem .9rem; font:inherit; border:1.5px solid var(--border); border-radius:10px; }
  input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(49,85,231,.18); }
  button { width:100%; margin-top:1rem; padding:.85rem; font:inherit; font-weight:700; color:#fff; background:var(--primary); border:0; border-radius:10px; cursor:pointer; }
  button:hover { background:var(--primary-hover); }
  button:disabled { opacity:.6; cursor:wait; }
  .error { min-height:1.3rem; margin-top:.8rem; color:var(--danger); font-size:.88rem; font-weight:600; }
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">C</div>
  <h1>Admin sign in</h1>
  <p>Carmel Publications catalog manager. Authorised staff only.</p>
  <form id="form" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" type="password" required autofocus autocomplete="current-password">
    <button id="submit" type="submit">Sign in</button>
    <div id="error" class="error" role="alert"></div>
  </form>
</main>
<script>
  const form = document.getElementById('form');
  const error = document.getElementById('error');
  const submit = document.getElementById('submit');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    error.textContent = '';
    submit.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'carmel-admin' },
        body: JSON.stringify({ password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (data.ok) { location.href = '/admin'; return; }
      error.textContent = data.error || 'Sign in failed.';
    } catch (e) {
      error.textContent = 'Cannot reach the admin server.';
    }
    submit.disabled = false;
    document.getElementById('password').select();
  });
</script>
</body>
</html>
